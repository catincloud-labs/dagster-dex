version: 2

updates:
  # GitHub Actions only.
  #
  # `pip` is deliberately absent, and this is a decision rather than an
  # omission. This package's `[dex]` extra pins `exmergo-dex-core~=1.8`, and
  # that pin is not housekeeping -- the mapping in `dex.py` targets dex-core's own
  # model, and the version is part of what the package claims to have been
  # verified against. A bot raising that pin would be editing a guarantee, and it
  # would do so with a diff that looks like routine maintenance.
  #
  # Bumping the engine is a human decision that comes with re-running the
  # boundary and criterion suites against the new version. See AGENTS.md.
  #
  # The single runtime dependency (`pyyaml>=6.0`) is a floor rather than a pin and
  # needs no bot either.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # ADR-0040 (constellation): grouped, so a month's bumps arrive as one pull
    # request read as a diff of commit hashes and version comments. The entry's
    # shape is stated once, in workbench #58; this is the amendment it asks of
    # the one repository that already ran Dependabot.
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # ADR-0042 (constellation), rule 10: the tools that read the coding standard
  # are pinned by version, once, in `scripts/power_of_ten_requirements.txt`,
  # and the pin has a mover. This entry is that mover. The file is a vendored
  # copy of workbench's `.github/actions/power-of-ten/requirements.txt` -- this
  # repository is public and cannot resolve a private action, so it carries
  # the checker, its self-test and the manifest under `scripts/`, byte-compared
  # to workbench by workbench's own `vendored copies` job. The two pins can
  # differ for part of a cycle: a bump lands here as a pull request, read as a
  # diff of a version and a changelog, and workbench's row says so.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
