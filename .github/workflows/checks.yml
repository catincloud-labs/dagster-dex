name: checks

# `edited` is here on purpose. A body edit is the normal way an unacknowledged
# close gets introduced or removed, and an early version of this gate omitted
# it -- so a corrected body never re-ran, and a broken one never re-checked.
# `synchronize` covers pushes to the branch.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  # `issues: read` is what makes `closingIssuesReferences` return anything at
  # all. Without it the field resolves to an EMPTY LIST rather than erroring, and
  # the reconcile step reads that as "merging this closes nothing" -- so the
  # check cannot tell *no closing reference* from *cannot see one*.
  #
  # The silent half is the dangerous one. A stray closing keyword in the prose
  # under an `Autoclose: none` trailer reconciles CLEAN, because a blind
  # "nothing" agrees with a trailer claiming nothing. That is precisely the case
  # this guard exists to catch, and without this line it cannot fire.
  #
  # Measured 2026-08-16 before adding this: `gh pr list --state merged --json
  # closingIssuesReferences` across every repository that runs this gate returned
  # ZERO pull requests that had ever closed an issue. So nothing escaped -- and
  # the reconcile had compared "nothing" against "nothing" every time it ran.
  #
  # Fixed per repository rather than once in the shared workflows, which is
  # otherwise the rule: `permissions:` is a property of the CALLING workflow and
  # a composite action cannot grant itself a scope.
  issues: read

# The job names below are load-bearing. `markdown`, `closing keywords` and
# `tests` are the literal strings the organisation's `required checks` rulesets
# demand. A rename does not fail -- the check simply never reports, and a check
# that never reports never blocks a merge. The gate would go quiet rather than red.
#
# Renaming one means editing the ruleset in the same change.
#
# ---------------------------------------------------------------------------
# WHY THE FIRST TWO JOBS ARE WRITTEN OUT HERE INSTEAD OF CALLING A SHARED ACTION
#
# They used to call composite actions from a sibling repository. That repository
# is private, and a workflow in a PUBLIC repository cannot resolve an action in a
# private one -- measured, not assumed, on four pull requests here:
#
#   ##[error]Unable to resolve action `<org>/<shared>`, not found
#
# It fails at `Set up job`, before any step runs, so both required checks failed
# on every pull request and nothing could merge. `tests` and `publish` were
# unaffected because they call public actions only.
#
# The rulesets match on CONTEXT STRING alone, so a job named `markdown` here
# satisfies exactly the same requirement the shared one did. Gate strength is
# unchanged; what changed is where the code lives.
#
# THE COST, STATED RATHER THAN DISCOVERED LATER: the check logic now exists in
# two places, and one of them cannot see the other. The shared action compared
# this repository's vendored guard byte-for-byte against its source on every run;
# that step is GONE from this file because it is the one thing that genuinely
# cannot work from here.
#
# It has not been dropped. It moved to the private side, which is the direction
# that does work -- a private job can read a public repository, and that was
# measured too. The vendored files below are compared there:
#
#   scripts/check_closing_keywords.py
#   scripts/test_check_closing_keywords.py
#   .github/markdownlint.json
#   scripts/check_third_party_pins.py
#   scripts/test_check_third_party_pins.py
#
# So do NOT edit those three to suit local taste. They are copies, they are
# checked, and the check is somewhere you cannot see from this file. The
# weakening is real and worth naming: drift is now caught after it lands rather
# than blocked on the pull request that introduces it.
# ---------------------------------------------------------------------------
jobs:
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Narrow to what this repository actually has. There is no `docs/`, and a
      # glob matching nothing is noise rather than coverage.
      #
      # The config is passed explicitly and lives at `.github/markdownlint.json`
      # rather than at the repository root. A root `.markdownlint.json` is
      # auto-discovered and outranks any shared default, so a copy of the estate
      # rules sitting there would read as this repository having DECIDED its own
      # lint rules. It has decided nothing. It is carrying a copy because it
      # cannot reach the original, and the location says which of those is true.
      #
      # Without `--config` the CLI falls back to its own defaults, where MD013
      # and MD041 are both ON -- so a wrong path must fail loudly rather than
      # lint quietly against the wrong rules. A missing file gives ENOENT.
      - name: markdownlint
        run: npx -y markdownlint-cli2 --config .github/markdownlint.json '*.md' '.github/**/*.md'

  closing-keywords:
    name: closing keywords
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The guard's own self-test runs before the guard does. A checker that has
      # silently stopped detecting anything passes every pull request, which is
      # the one failure mode this job cannot otherwise observe.
      #
      # Vendored, like the guard beside it, and for the same reason: this
      # repository cannot call the shared action. Both files are compared against
      # `workbench` from the private side -- see the note at the head of this
      # file -- so neither is edited here.
      - name: Guard fires and goes quiet
        run: python scripts/test_check_closing_keywords.py

      - name: Scan the pull request body
        run: |
          gh pr view "$PR" --json body -q .body > "$RUNNER_TEMP/pr-body.md"
          python scripts/check_closing_keywords.py "$RUNNER_TEMP/pr-body.md"

      - name: Scan every commit message in the pull request
        run: |
          gh pr view "$PR" --json commits \
            -q '.commits[].messageHeadline + "\n" + .commits[].messageBody' \
            > "$RUNNER_TEMP/pr-commits.txt"
          python scripts/check_closing_keywords.py "$RUNNER_TEMP/pr-commits.txt"

      # The regex above is our reimplementation; this is the authority. When the
      # two disagree, believe this one -- but read the reported line before
      # believing the disagreement, because the field lags a body edit by tens of
      # seconds and reads empty right after a pull request opens.
      - name: Ask GitHub what it will actually close
        run: |
          # This step fetches; it does not decide. Reading the trailer and
          # comparing the two sets is the guard's rule, so it lives in the script
          # and is exercised by the self-test above.
          #
          # KEY: do not add a second reader here. CI once grew its own `grep` for
          # the trailer alongside the script's `find_acknowledged()`, and the two
          # disagreed -- the grep was anchored at line start and not fence-aware,
          # so a body that merely SHOWED an example trailer failed CI, which is
          # the exact case the self-test pins as clean. If the rule needs to
          # change, change it in the script.
          gh pr view "$PR" --json body -q .body > "$RUNNER_TEMP/pr-body-reconcile.md"

          attempt() {
            reported="$(
              gh pr view "$PR" --json closingIssuesReferences \
                -q '[.closingIssuesReferences[].number] | sort | join(",")'
            )"
            python scripts/check_closing_keywords.py \
              --github-closes "$reported" \
              "$RUNNER_TEMP/pr-body-reconcile.md" \
              > "$RUNNER_TEMP/reconcile.txt" 2>&1
          }

          # The field lags a body edit by tens of seconds and reads empty right
          # after a pull request opens, so one disagreement is not believed until
          # it has been asked again. Timing is this step's business; the verdict
          # is not.
          if attempt; then
            cat "$RUNNER_TEMP/reconcile.txt"
            exit 0
          fi

          echo "Disagreement on first read; the field lags an edit. Re-asking in 30s."
          sleep 30

          if attempt; then
            cat "$RUNNER_TEMP/reconcile.txt"
            exit 0
          fi

          cat "$RUNNER_TEMP/reconcile.txt"
          echo "::error::GitHub and the Autoclose trailer disagree about what merging this will close."
          exit 1


  # Vendored for the same reason as the two jobs above it: this public
  # repository cannot resolve the private shared action, and the rulesets it
  # answers to match on context strings a local job can carry. Unlike those
  # two this context is NOT required by any ruleset -- the gate is advisory
  # red, which is still more than the prose that held the rule alone until
  # now (a convention held only by text died estate-wide in a day once, and
  # that measurement is why the guard exists).
  #
  # `scripts/check_pr_title.py` is a byte-identical copy of the guard in the
  # private shared repository, compared from the private side like the other
  # vendored files -- do not edit it here. The self-test runs first, so a
  # checker that silently stopped detecting anything cannot pass a title.
  pr-title:
    name: pr title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard fires and goes quiet
        run: python scripts/check_pr_title.py --self-test

      # The title reaches the script through the environment, never
      # interpolated into shell -- a title is attacker-adjacent text on a
      # public repository.
      - name: Judge the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python scripts/check_pr_title.py --title "$PR_TITLE" --author "$PR_AUTHOR"

  # ---------------------------------------------------------------------------
  # THE JOB NAMED `tests` IS THE AGGREGATE AT THE BOTTOM OF THIS FILE, NOT A
  # SUITE. Read the note on it before renaming anything here.
  #
  # What follows is three jobs across two axes, and neither axis existed before
  # 2026-08-18. Until then this was one job, on one interpreter, with the engine
  # at one exact version - while the package published `requires-python >= 3.10`
  # and a compatible-release range for the engine. Both promises were verified by
  # a human running a matrix by hand at each release and remembering to. A step
  # that has to be remembered is not a control.
  #
  # THE CROSS-PRODUCT IS ONE NAMED CELL, NOT A MATRIX. The engine axis below
  # runs on the NEWEST CLAIMED interpreter - `--python` on its steps, moved
  # together with the `python-floor` list when a version is added there - so
  # its cells are "the ends of the published range on the newest interpreter",
  # which is the cell this header used to name as deliberately untested. The
  # REST of the product is still not run, stated rather than left for a green
  # matrix to imply: the intermediate interpreters never meet the engine here
  # (3.10 cannot at all - dex-core's own floor is 3.11), and quadrupling the
  # job count for combinations no consumer has reported needing is still the
  # wrong trade.
  # ---------------------------------------------------------------------------

  # The engine range, resolved rather than listed. See the long docstring in
  # `scripts/resolve_engine_range.py` for why a hand-written list of versions
  # would be a registry that fails open the day upstream publishes a patch.
  engine-range:
    name: engine range
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The script prints ONE json array on stdout and everything else on
      # stderr, so this capture cannot pick up a log line by accident. It exits
      # nonzero rather than printing an empty array when it cannot resolve -- a
      # matrix built from `[]` runs no jobs and reports success, which is the
      # fail-open shape the whole arrangement exists to avoid.
      - name: Resolve the ends of the published engine range
        id: resolve
        run: |
          set -euo pipefail
          VERSIONS="$(python scripts/resolve_engine_range.py)"
          echo "resolved: ${VERSIONS}"
          echo "versions=${VERSIONS}" >> "$GITHUB_OUTPUT"

  # THIS JOB IS THE CONTROL, and matrixing it did not weaken it.
  #
  # It runs the whole suite with dex-core UNINSTALLED, which is what holds the
  # engine coupling to `dex.py` alone. Add an `exmergo_dex_core` import to any
  # other module and this goes red at collection -- the package's central claim
  # being tested rather than asserted. It now goes red at collection on four
  # interpreters instead of one.
  #
  # It also carries the OTHER promise: `requires-python = ">=3.10"`. That was a
  # sentence in `pyproject.toml` and nothing else. The floor is set by the
  # CORE, not by the heaviest extra -- the `[dex]` extra cannot install on 3.10
  # at all, because dex-core requires >=3.11, and that is a supported
  # configuration rather than a hole. Which is exactly why this axis runs the
  # engine-free suite: it is the only suite 3.10 can run, and 3.10 is the
  # version the floor claim is about.
  python-floor:
    name: python ${{ matrix.python }} (engine-free)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The four versions `requires-python` and the Dagster range admit.
        # Unlike the engine axis, this list IS written out, and the reason is
        # that it is not derivable: `>=3.10` is open-ended, so a resolver would
        # answer "every future release" and the honest set is "the ones this
        # package claims and Dagster supports". Adding 3.14 here is a decision
        # about what is claimed, which is a thing to review rather than compute.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Core runs with no engine installed (control)
        run: |
          uv run --no-project --python ${{ matrix.python }} --with-editable . \
            --with pytest==8.4.1 \
            python -m pytest tests \
            --ignore=tests/test_dex_bridge.py \
            --ignore=tests/test_upstream_contract.py

  # The ENDS of the published range, which nothing ran until now.
  #
  # This does not replace the exactly-pinned steps in `suite` below, and must
  # not be folded into them. They are two different claims, and `AGENTS.md`'s
  # "two pins" section is the argument: the exact pin is the version the mapping
  # was DEMONSTRATED against and is named in every reproduction command, while
  # this is the range the package PROMISES a consumer's resolver. Folding them
  # would delete one of the two.
  #
  # It also means the literal `exmergo-dex-core==` pins stay in `suite`, where
  # `tests/test_pin_coherence.py` can still see them. A matrix expression is not
  # a pin, so templating those steps would have quietly shrunk that guard's
  # corpus by two sites while every count it reports stayed green.
  engine-ends:
    name: dex-core ${{ matrix.version }}
    needs: engine-range
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.engine-range.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # `--python 3.13` is the cross-product cell: the newest interpreter the
      # `python-floor` list claims, named here rather than inherited from
      # whatever the runner resolves. Move it when that list gains a version.
      - name: Boundary runs against this end of the range
        run: |
          uv run --no-project --python 3.13 --with-editable . \
            --with pytest==8.4.1 \
            --with exmergo-dex-core==${{ matrix.version }} --with sqlglot==30.13.0 \
            python -m pytest tests --ignore=tests/test_upstream_contract.py

      # Upstream's own contract judges a SHAPE, and since the write tier reached
      # the artifact transport it judges two of them. Running it only at the
      # demonstrated pin left the promised ends unjudged by the one suite whose
      # author is somebody else.
      - name: This format passes dex-core's own project contract
        env:
          DEX_UPSTREAM_CONTRACT_REQUIRED: "1"
        run: |
          uv run --no-project --python 3.13 --with-editable . \
            --with pytest==8.4.1 \
            --with exmergo-dex-core==${{ matrix.version }} --with sqlglot==30.13.0 \
            python -m pytest tests/test_upstream_contract.py -p no:cacheprovider

  # The demonstrated pin, and the two steps that install neither pytest nor the
  # engine. This job is the former `tests`, renamed: its steps are unchanged and
  # its exact pins are deliberately still literal strings.
  suite:
    name: suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The engine is pinned EXACTLY here, which is deliberately not what the
      # `[dex]` extra publishes (`~=1.8`). Consumers should not be forced onto
      # one patch release; the demonstration should name the version it ran
      # against. `sqlglot` is pinned for determinism only.
      - name: Boundary runs against the real engine
        run: |
          uv run --no-project --with-editable . \
            --with pytest==8.4.1 --with exmergo-dex-core==1.8.0 --with sqlglot==30.13.0 \
            python -m pytest tests --ignore=tests/test_upstream_contract.py

      # This package ships a PEP 561 `py.typed` marker and the `Typing :: Typed`
      # classifier, which together claim its annotations are usable downstream.
      # That claim is only worth something if something checks it -- a marker
      # shipped on unchecked code is the decorative-control shape. Run at the
      # floor (3.10), which is the version the annotations must be valid against.
      - name: Type check (the py.typed claim, actually checked)
        run: |
          uv run --no-project --with-editable . \
            --with mypy==1.14.1 --with types-PyYAML \
            python -m mypy

      # A real Dagster graph, which no other step exercises. Every test above
      # uses fakes -- deliberately, so the suite runs without an orchestrator --
      # but that means nothing else here would notice `from_asset_graph` breaking
      # against the objects Dagster actually hands it. The `[dagster]` extra was
      # declared and never installed by anything until this step existed.
      #
      # THE ASSERTIONS MOVED OUT OF THIS FILE AND INTO `examples/`, and the file
      # they moved to is now what this step runs. They were a `python -c` blob
      # here: twenty-eight lines of Python inside YAML inside `run: |`, with the
      # quoting hazards that implies, no line numbers in a traceback, and -- the
      # reason this changed -- the package's only runnable demonstration living
      # in the one file a reader never opens.
      #
      # CONTRIBUTING.md asked for a runnable example and named its absence the
      # clearest gap. Adding one *beside* this step would have created the other
      # failure this repository keeps recording: an example nobody executes, which
      # is the same shape as an extension point nobody resolves. Being the step is
      # what stops it rotting.
      #
      # It cannot use pytest: this is the only step that installs `dagster`, and
      # it installs no test runner. Plain asserts and a nonzero exit, deliberately.
      - name: The reduction works against real Dagster objects
        run: |
          uv run --no-project --with-editable . --with 'dagster>=1.13' \
            python examples/reduce_asset_graph.py

      # The README's scheduled-artifact sketch used to be prose nothing ran,
      # and said so as a stated cost. This is that sketch's mechanics executed:
      # the op body against a real graph, the job in process, the artifact read
      # back, the schedule constructed. The schedule VALUES stay the reader's
      # decision - which is why the sketch remains in the README and this runs
      # beside it rather than replacing it.
      - name: The scheduled-artifact sketch's mechanics execute
        run: |
          uv run --no-project --with-editable . --with 'dagster>=1.13' \
            python examples/write_project_artifact.py

      # The step above stops at the reduction, and the two drivers under
      # `scripts/` reach the write tier with FAKE asset objects and a fabricated
      # drift finding. So until this step existed, nothing here put a real graph
      # in front of a real warehouse and let dex find drift by itself -- the
      # package's headline claim was the one thing no check made.
      #
      # It is affordable because dex-core's DuckDB adapter is free and local
      # (`paradigm: free_local`): no credential, no network, no bill, and
      # deterministic. This is the only step that installs the orchestrator, the
      # engine and a warehouse together.
      #
      # Same two constraints as the step above: it IS the example, so it stays
      # readable and runnable by hand, and it cannot use pytest because nothing
      # installs one alongside `dagster`.
      #
      # Its load-bearing assertion is that a broken grain on `dim_date` reports
      # `fact_sales` in `impacted_models`. Nothing in the warehouse connects
      # them; only the asset graph does. Verified to FAIL when the `deps=` edge
      # is removed, so it is a control that has been observed firing rather than
      # one that has only ever passed.
      - name: The whole loop works against a real warehouse
        run: |
          uv run --no-project --with-editable . --with 'dagster>=1.13' \
            --with exmergo-dex-core==1.8.0 --with sqlglot==30.13.0 --with duckdb \
            python examples/walk_the_whole_loop.py

      # `DEX_UPSTREAM_CONTRACT_REQUIRED=1` turns a missing upstream contract from
      # a green skip into a collection error. Without it, a dex-core that stopped
      # shipping `adapters.conformance` would leave this file quietly unrun and the
      # job green -- and an unrun file and a passing file look identical.
      - name: This format passes dex-core's own project contract
        env:
          DEX_UPSTREAM_CONTRACT_REQUIRED: "1"
        run: |
          uv run --no-project --with-editable . \
            --with pytest==8.4.1 --with exmergo-dex-core==1.8.0 --with sqlglot==30.13.0 \
            python -m pytest tests/test_upstream_contract.py -p no:cacheprovider

  # ---------------------------------------------------------------------------
  # THE NAME `tests` IS LOAD-BEARING AND THIS JOB EXISTS TO CARRY IT.
  #
  # `tests` is a required status check on an ORGANISATION ruleset -- "required
  # checks: repos with a test suite", matched on the repository property
  # `test-suite=true`. A required check matches by CONTEXT STRING. Put a
  # `strategy.matrix` on a job called `tests` and its contexts become
  # `tests (3.10)`, `tests (3.11)` and so on; the context `tests` then never
  # reports, and a check that never reports never blocks a merge. THE GATE GOES
  # QUIET RATHER THAN RED, which is the worse failure and the one nobody sees.
  #
  # So the matrixed work is in the jobs above under their own names, and this
  # reads their results. Renaming it means editing the organisation ruleset in
  # the same change.
  #
  # `skipped` IS TREATED AS A FAILURE. Every job above carries `needs:` or can
  # be skipped when an upstream one fails, and `if: always()` means this runs
  # anyway -- so a skipped `engine-ends` (because `engine-range` could not
  # resolve) must not be read as "nothing to complain about". Reading the results
  # explicitly is what makes a skip a decision rather than an accident.
  #
  # The shape is lifted from `catincloud-labs/groundstation`'s `ci.yml`, where it
  # was written after observing exactly that: a red job skipping two downstream
  # ones and the aggregate reporting success.
  # ---------------------------------------------------------------------------
  tests:
    name: tests
    if: always()
    needs:
      - engine-range
      - python-floor
      - engine-ends
      - suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse unless every job above actually succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "upstream results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a job this gate depends on reported '${result}', not 'success'."
              exit 1
            fi
          done
          # An empty RESULTS would fall through the loop and pass. It cannot
          # happen while `needs:` is non-empty, but "I checked nothing" must
          # never be the same output as "everything passed".
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::no upstream results to read; this gate scanned nothing."
            exit 1
          fi
          echo "every job this gate depends on succeeded."

  # ADR-0040 (constellation): every third-party action ref in this tree is a
  # forty-character commit with its version as a trailing comment, from a
  # publisher the record enumerates. VENDORED, like the guards above and for
  # the same reason: this repository is public and cannot resolve the private
  # action, so the scanner runs from `scripts/`, and the private repository's
  # `vendored copies` job holds both files to their canonical copies. Do not
  # edit them here. Dependabot (`.github/dependabot.yml`) is the mover; this
  # is what makes a hand edit at a tag visible - which this repository has
  # already lived once: `pr-hygiene.yml` arrived at `checkout@v4` by hand on
  # 2026-08-27 beside eleven sites at `v7`, and nothing said so until the
  # next Dependabot cycle.
  #
  # Deliberately NOT in the `tests` gate's `needs:` above, and not a required
  # check today: either would make it required by the back door, and that is
  # the owner's decision to take with the blocking cost in view.
  third-party-pins:
    name: third-party pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The guard's own self-test runs before the guard does, here rather
      # than trusted to have run once where the checker was authored.
      - name: Guard fires and goes quiet
        run: python3 scripts/test_check_third_party_pins.py

      - name: Every third-party ref in this tree is a commit with its version
        run: python3 scripts/check_third_party_pins.py --org catincloud-labs --tree .
