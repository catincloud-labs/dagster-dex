name: publish

# The release path for this package.
#
# NOTHING HERE PUBLISHES WITHOUT A TAG. A merge cannot release, and a tag cannot
# half-release. `0.1.0` went out on 2026-08-15 from `v0.1.0`, so the one-time
# setup is done and what remains is short.
#
# TO CUT A RELEASE (both, in order):
#   1. BUMP THE VERSION -- `version` in pyproject.toml and `__version__` in
#      `__init__.py`, two hand-maintained strings a test pins as equal. This is
#      no longer optional the way it was for the first release: `0.1.0` exists
#      on PyPI, and an index refuses a version it already holds. A tag cut
#      without a bump stops at the match gate below, which is the cheap place to
#      discover it.
#   2. Tag the merged bump, and push the tag:
#        git tag v0.1.1 && git push origin v0.1.1
#      `build` runs, then `publish` WAITS on the `pypi` environment's required
#      reviewer. That pause is the last moment at which nothing has been
#      uploaded; everything after it is irreversible.
#
# REHEARSE FIRST IF THIS FILE CHANGED. `Actions => publish => Run workflow` puts
# a `.dev<run number>` build on TestPyPI and reads its provenance back. Cheap,
# repeatable, and the only place the upload path can be wrong for free. A plain
# version bump does not need it.
#
# THE ONE-TIME SETUP, RECORDED SO IT IS NOT REDISCOVERED. Both Trusted Publishers
# began as PENDING publishers -- an ordinary one cannot attach to a project that
# does not exist yet -- and both were converted to ordinary ones by their first
# successful upload:
#   - PyPI     : project `dagster-dex`, owner `catincloud-labs`, repo
#                `dagster-dex`, workflow `publish.yml`, environment `pypi`.
#   - TestPyPI : the same, environment `testpypi`.
#   - `pypi` environment: required reviewer, deployments restricted to `v*` TAGS.
#                `prevent_self_review` is off deliberately -- with a single
#                reviewer, on would mean no release can ever be approved.
#   - `testpypi` environment: deployments restricted to `main`, no reviewer,
#                because the dispatch is already a deliberate human act.
# A publisher matches on owner AND repo. `catincloudlabs` (no hyphen) is a
# DIFFERENT organisation holding other repositories in this estate, and naming it
# by mistake fails at upload -- after a tag is cut, having built and tested green.
#
# The tag is a bare `v*` because this repository holds exactly one
# distribution. It was namespaced (`dagster-dex-project-v*`) in the monorepo this
# came from, where a bare tag would have collided with everything else in the tree.
# That reason does not travel.
#
# WHY `pypa/gh-action-pypi-publish` AND NOT `uv publish`, WHICH THIS USED TO USE.
# uv does not generate PEP 740 attestations. It uploads `.publish.attestation`
# files that something else produced, and generates none itself -- so a release
# cut with it carries a verified PUBLISHER and no verifiable PROVENANCE, and that
# gap cannot be closed afterwards: attestations attach at upload and PyPI files
# are immutable. The action generates them by default under Trusted Publishing,
# on PyPI and TestPyPI alike. uv still BUILDS both distributions here; only the
# upload moved.
#
# THE COST, STATED RATHER THAN DISCOVERED LATER: this drops uv's
# `--trusted-publishing always`, which failed closed and named the real cause
# rather than falling back to hunting for a token. The action has no equivalent
# switch, and does not need one -- with no `password` supplied there is nothing
# for it to fall back TO, so the same fail-closed shape is reached by having no
# alternative rather than by a flag.
#
# It is pinned to an exact version rather than the `@v7`-style major tag the
# other actions here use, because this one publishes no major tag: `release/v1`
# is a BRANCH. A moving branch on the step that holds the release identity is the
# wrong trade, and dependabot keeps the exact pin fresh.

on:
  push:
    tags: ["v*"]
  # Build-only on every PR. This is the half that earns its keep before any
  # release: it proves the distribution still BUILDS, which the `tests` job in
  # `checks.yml` does not -- that one installs editable, and an editable install
  # can succeed against packaging metadata that cannot produce a valid sdist.
  pull_request:
  # The rehearsal, and manual on purpose. Uploading to TestPyPI on every merge
  # would make the rehearsal a routine that nobody reads the output of, which is
  # the opposite of what step 1 above is for.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The same steps `checks.yml` runs, and for the same reasons -- step 1 is a
      # CONTROL proving the engine coupling is one file, not a speed split.
      # Repeated here rather than depended on, because a release gate that trusts
      # another workflow's green is trusting a run that may have been for a
      # different commit.
      - name: Core runs with no engine installed (control)
        run: |
          uv run --no-project --with-editable . \
            --with pytest==8.4.1 \
            python -m pytest tests \
            --ignore=tests/test_dex_bridge.py \
            --ignore=tests/test_upstream_contract.py

      - name: Boundary + upstream contract against the real engine
        env:
          DEX_UPSTREAM_CONTRACT_REQUIRED: "1"
        run: |
          uv run --no-project --with-editable . \
            --with pytest==8.4.1 --with exmergo-dex-core==1.6.5 --with sqlglot==30.13.0 \
            python -m pytest tests

      - name: Build sdist + wheel
        run: uv build

      # A built sdist is not a working one. This installs the ARTIFACT rather than
      # the source tree, which is the only thing that catches a
      # `[tool.setuptools.packages.find]` that misses a module, a missing `LICENSE`
      # in the sdist, or a `py.typed` marker that never made it into the wheel --
      # all of which pass every test above, because every test above runs against
      # the working directory.
      - name: The built wheel imports, declares its entry point, and ships py.typed
        run: |
          WHEEL=$(ls dist/*.whl)
          uv run --no-project --with "./${WHEEL}" python -c "
          import importlib.metadata as md
          import importlib.resources as res
          import dagster_dex as p
          eps = md.entry_points(group='exmergo_dex_core.projects')
          names = {e.name: e.value for e in eps}
          assert 'dagster' in names, f'entry point missing from the built wheel: {names}'
          assert res.files('dagster_dex').joinpath('py.typed').is_file(), \
              'Typing :: Typed is claimed but py.typed is not in the wheel'
          print('version :', md.version('dagster-dex'))
          print('entry   :', names['dagster'])
          print('exports :', len(p.__all__), 'names')
          "

      # The step above proves the wheel is a working DISTRIBUTION. It does not
      # prove the wheel is a working PROJECT FORMAT, and until this step existed
      # nothing did: every behavioural test in this repository runs against the
      # working directory, so "dex can read a project through the thing we
      # publish" was asserted nowhere.
      #
      # That gap had the shape this package already has a lesson about. A
      # declared-but-unresolved extension point is not evidence that
      # registration works -- and "the wheel installs and the entry point is
      # present" is a claim of exactly that shape, one level up.
      #
      # The engine is installed here and NOT above, deliberately: the step above
      # must keep proving the wheel imports with dex-core absent, which is the
      # same control the first test step applies to the source tree.
      - name: dex reads a project through the built wheel (end to end)
        run: |
          WHEEL=$(ls dist/*.whl)
          uv run --no-project --with "./${WHEEL}" \
            --with exmergo-dex-core==1.6.5 --with sqlglot==30.13.0 \
            python scripts/drive_dex_against_the_wheel.py

      - uses: actions/upload-artifact@v7
        with:
          name: dagster-dex-dist
          path: dist/

  rehearse:
    # Manual only. A PR reaches `build` and stops there; a tag goes to `publish`.
    #
    # THIS JOB IS THE ONLY PLACE THE OIDC PATH CAN BE EXERCISED BEFORE IT MATTERS.
    # Everything the real publish does that can fail -- minting a token against a
    # pending publisher, matching the environment name, the distribution name
    # being one the publisher recognises, signing an attestation and having the
    # index store it -- fails here instead, against a namespace where being wrong
    # costs nothing.
    #
    # WHAT IT DOES NOT PROVE: PyPI and TestPyPI are separate services carrying
    # separate publisher stamps, so a green rehearsal is evidence about the
    # TestPyPI one alone. It proves the SHAPE is right. If the PyPI stamp is ever
    # changed or removed, nothing here notices.
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A DIFFERENT environment from the real one, and that is not tidiness: a
    # Trusted Publisher matches on environment name, so a rehearsal running in
    # `pypi` would either fail against the TestPyPI stamp or, if `pypi` were ever
    # stamped on both, let a rehearsal run under the identity of the real
    # release. The two identities stay separate at the only place that enforces it.
    environment: testpypi
    permissions:
      # Restated rather than inherited, for the reason spelled out in `publish`.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      # A rehearsal that can only be run once is not a rehearsal. An index
      # refuses a filename it already holds, so uploading the real `0.1.0` here
      # would make the SECOND attempt fail at the upload step for a reason that
      # has nothing to do with what is being rehearsed -- and the second attempt
      # is the one that runs after fixing whatever the first found. The run
      # number gives every rehearsal its own PEP 440 dev release, which sorts
      # BELOW the version it is derived from and so never shadows it.
      #
      # BOTH strings are stamped, not just the one that reaches the metadata.
      # `tests/test_packaging.py` pins them as equal, and an artifact reporting
      # one version at runtime and another in its metadata is the exact thing
      # that test exists to prevent. A rehearsal is allowed to be throwaway; it
      # is not allowed to be inconsistent in a way the real path forbids.
      #
      # The base version is READ rather than written here, so this does not rot
      # silently at the next bump. If either substitution misses, the job stops:
      # a no-op `sed` would quietly rehearse against the real version number.
      - name: Stamp a throwaway dev version so the rehearsal can be repeated
        run: |
          BASE=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          REHEARSAL="${BASE}.dev${{ github.run_number }}"
          sed -i "s/^version = \"${BASE}\"/version = \"${REHEARSAL}\"/" pyproject.toml
          sed -i "s/^__version__ = \"${BASE}\"/__version__ = \"${REHEARSAL}\"/" \
            src/dagster_dex/__init__.py
          grep -qx "version = \"${REHEARSAL}\"" pyproject.toml \
            || { echo "pyproject.toml version was not stamped"; exit 1; }
          grep -qx "__version__ = \"${REHEARSAL}\"" src/dagster_dex/__init__.py \
            || { echo "__init__.py __version__ was not stamped"; exit 1; }
          echo "Rehearsing as ${REHEARSAL} (real version ${BASE} is untouched)."
          # Carried to the provenance check below, which has to name the exact
          # version it is asking the index about.
          echo "REHEARSAL_VERSION=${REHEARSAL}" >> "$GITHUB_ENV"

      - name: Build sdist + wheel
        run: uv build

      # `repository-url` is the WHOLE difference from the real publish. The OIDC
      # audience is fetched from the upload host rather than assumed
      # (`/_/oidc/audience` answers `testpypi` here and `pypi` there), so pointing
      # at the other host cannot present a token minted for the real index.
      - name: Publish to TestPyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

      # The attestation is a CLAIM until something reads it back, and the whole
      # reason this job exists is that unread claims are how releases go wrong
      # late. So: ask the index what provenance it actually stored, and check the
      # IDENTITY inside it rather than its presence. An attestation naming a
      # different repository, workflow or environment is a pass under a
      # presence-only check and is exactly the thing worth catching.
      #
      # Bounded retry, because the Integrity API can lag the upload by seconds.
      # After five tries it is a real absence rather than a slow index -- and a
      # real absence means the upload succeeded with no provenance at all, which
      # is the silent half of this whole change.
      - name: The index stored provenance, and it names this workflow
        env:
          INDEX: https://test.pypi.org
          EXPECT_ENVIRONMENT: testpypi
        run: |
          WHEEL=$(basename "$(ls dist/*.whl)")
          URL="${INDEX}/integrity/dagster-dex/${REHEARSAL_VERSION}/${WHEEL}/provenance"
          CODE=000
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sS -o provenance.json -w '%{http_code}' "$URL")
            [ "$CODE" = "200" ] && break
            echo "attempt ${attempt}: HTTP ${CODE}, re-asking in 10s"
            sleep 10
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::No provenance at ${URL} (HTTP ${CODE}). The upload succeeded and shipped nothing to verify it."
            exit 1
          fi
          python3 - "$EXPECT_ENVIRONMENT" <<'PY'
          import json
          import os
          import sys

          expected = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": "publish.yml",
              "environment": sys.argv[1],
          }
          bundles = json.load(open("provenance.json"))["attestation_bundles"]
          publishers = [b["publisher"] for b in bundles]
          print("publishers :", json.dumps(publishers))
          for field, want in expected.items():
              got = {p.get(field) for p in publishers}
              if want not in got:
                  sys.exit(f"provenance {field} is {got}, expected {want!r}")
          count = sum(len(b["attestations"]) for b in bundles)
          print(f"verified   : {count} attestation(s) naming this workflow")
          PY
          echo "${INDEX}/project/dagster-dex/" >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Tag only. A PR reaches `build` and stops there.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      # Job-level permissions REPLACE the top-level block rather than merging
      # with it, so `contents: read` has to be restated or checkout 404s with a
      # token holding only `id-token: write`.
      contents: read
      id-token: write # OIDC for PyPI Trusted Publishing; no API token is stored.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Build sdist + wheel
        run: uv build

      # The version is STATIC in pyproject.toml -- there is no hatch-vcs here to
      # derive it from the tag -- so the tag and the metadata are two independent
      # hand-maintained strings. A tag cut without bumping the version would
      # otherwise publish the PREVIOUS version's number, and PyPI would reject it
      # as a duplicate at best or accept a wrong-numbered artifact at worst.
      - name: Built version must match the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! ls dist/dagster_dex-"${VERSION}"-*.whl >/dev/null 2>&1; then
            echo "Built artifacts do not match tag version ${VERSION}:"
            ls -1 dist/
            echo "Bump the version in pyproject.toml, merge, then re-tag."
            exit 1
          fi
          echo "Built artifacts match ${VERSION}."

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2

      # The same read-back as the rehearsal, and it FAILS THE JOB, which needs
      # saying because by the time it runs the release is already on PyPI and
      # nothing here can take it off. A red job over a published release is the
      # honest report: this version shipped without verifiable provenance, the
      # only remedy is the next one, and a green tick would hide that until
      # somebody went looking. The rehearsal is what stops this from firing.
      - name: The index stored provenance, and it names this workflow
        env:
          INDEX: https://pypi.org
          EXPECT_ENVIRONMENT: pypi
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WHEEL=$(basename "$(ls dist/*.whl)")
          URL="${INDEX}/integrity/dagster-dex/${VERSION}/${WHEEL}/provenance"
          CODE=000
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sS -o provenance.json -w '%{http_code}' "$URL")
            [ "$CODE" = "200" ] && break
            echo "attempt ${attempt}: HTTP ${CODE}, re-asking in 10s"
            sleep 10
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::${VERSION} is published, but there is no provenance at ${URL} (HTTP ${CODE})."
            exit 1
          fi
          python3 - "$EXPECT_ENVIRONMENT" <<'PY'
          import json
          import os
          import sys

          expected = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": "publish.yml",
              "environment": sys.argv[1],
          }
          bundles = json.load(open("provenance.json"))["attestation_bundles"]
          publishers = [b["publisher"] for b in bundles]
          print("publishers :", json.dumps(publishers))
          for field, want in expected.items():
              got = {p.get(field) for p in publishers}
              if want not in got:
                  sys.exit(f"provenance {field} is {got}, expected {want!r}")
          count = sum(len(b["attestations"]) for b in bundles)
          print(f"verified   : {count} attestation(s) naming this workflow")
          PY
          echo "${INDEX}/project/dagster-dex/" >> "$GITHUB_STEP_SUMMARY"
